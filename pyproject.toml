[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mscoot"
version = "0.1.0"
description = "MS-COOT: Comparing Morse-Smale Complexes with Co-Optimal Transport"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "POT>=0.8.0",
    "networkx>=2.6.0",
    "gudhi>=3.4.0",
    "PyYAML>=6.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
ttk = [
    "vtk>=9.0.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
